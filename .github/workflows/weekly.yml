name: Sunday video

# Every Sunday: "The Flop of the week", one video with Trump's post of the week and the presidential
# version, then one Swiss and one French version (scripts/social/videos.mjs --weekly). It is committed
# to public/social/weekly/<date>/, the site is redeployed, and the hourly run of "Social networks"
# posts it within the hour. To choose the versions yourself, add to content/social/weekly.json:
#   { "2026-11-15": { "original": "<slug>", "swiss": "<slug>/<region>", "france": "<slug>/<region>" } }
on:
  schedule:
    - cron: '7 17 * * 0' # Sundays, 17:07 UTC: 9:07 in California, 18:07 in Switzerland
  workflow_dispatch:
    inputs:
      date:
        description: 'The Sunday (YYYY-MM-DD), optional'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render the Sunday video
        run: node scripts/social/videos.mjs --weekly ${{ inputs.date }}
      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A public/social
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sunday video [skip ci]"
            git push
            gh workflow run deploy.yml --ref main
          fi
