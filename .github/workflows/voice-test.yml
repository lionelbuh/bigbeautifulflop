name: Voice test (Piper)

# A one-off test: Monsieur Neutre's lines of one episode read by free Piper voices (open source, run here).
# The audio files and the voices' model cards are committed to the branch the workflow is run on.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Episode (statement slug)'
        required: true
        default: 'trash-island'
      voices:
        description: 'Piper voices, separated by spaces'
        required: false
        default: 'en_GB-alan-medium en_US-ryan-high'

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the lines with two voices
        run: |
          pip install -q piper-tts
          mkdir -p tmp-voice && cd tmp-voice
          for n in ${{ inputs.voices }}; do
            python3 -m piper.download_voices $n || echo "could not download $n"
            # the voice's model card (its dataset and licence): en/en_US/ryan/high/MODEL_CARD
            lang=${n%%-*}; rest=${n#*-}; name=${rest%-*}; q=${rest##*-}
            curl -sSLf -o $n.MODEL_CARD "https://huggingface.co/rhasspy/piper-voices/resolve/main/${lang%%_*}/$lang/$name/$q/MODEL_CARD" || echo "no model card for $n"
          done
          ls -la
          python3 - "${{ inputs.slug }}" "${{ inputs.voices }}" <<'PY'
          import json, subprocess, sys
          s = json.load(open(f'../content/statements/{sys.argv[1]}.json'))
          lines = [('n', x) for x in s['episode']['neutral']] + [('v', x) for x in s['episode']['reaction']]
          import os
          for voice in [v for v in sys.argv[2].split() if os.path.exists(f'{v}.onnx')]:
              for i, (part, text) in enumerate(lines):
                  out = f'{voice}-{part}{i}.wav'
                  subprocess.run(['python3', '-m', 'piper', '-m', f'{voice}.onnx', '-f', out, '--length-scale', '1.08'], input=text.replace('*', '').encode(), check=True)
          PY
          rm -f *.onnx *.onnx.json
          ls -la
      - name: Commit the audio to this branch
        run: |
          mkdir -p voice-test && mv tmp-voice/* voice-test/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice-test
          git pull -q --rebase || true
          git commit -m "Voice test (Piper): ${{ inputs.slug }} [skip ci]"
          git push
