name: Deploy to GitHub Pages

# Builds dist/ and publishes it on each push to main, and every night so that the
# "edition of the day" served to visitors without JavaScript follows the calendar.
# One-time setup: Settings → Pages → Source: "GitHub Actions"; custom domain bigbeautifulflop.com.
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
