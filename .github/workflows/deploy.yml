name: Deploy to GitHub Pages

# Builds dist/ and publishes it on each push to main, and every night so that the
# "edition of the day" served to visitors without JavaScript follows the calendar.
# One-time setup: Settings → Pages → Source: "GitHub Actions"; custom domain bigbeautifulflop.com.
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tells the IndexNow search engines (Bing, Yandex, Seznam, Naver…) that the pages changed, so
  # Bing does not wait weeks to visit. Google does not use IndexNow: it reads the sitemap.
  # The key is public by design; the same value is published at https://bigbeautifulflop.com/<key>.txt.
  indexnow:
    needs: deploy
    if: github.event_name != 'schedule' # the nightly rebuild changes no page worth announcing
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      INDEXNOW_KEY: 6fb8e60d42b473a1d55b2ae6387f102d
    steps:
      - name: Submit the sitemap URLs to IndexNow
        run: |
          sleep 60  # let GitHub Pages serve the new version
          urls=$(curl -fsS https://bigbeautifulflop.com/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s .)
          jq -n --argjson urls "$urls" --arg key "$INDEXNOW_KEY" \
            '{host: "bigbeautifulflop.com", key: $key, keyLocation: ("https://bigbeautifulflop.com/" + $key + ".txt"), urlList: $urls}' \
            | curl -sS -X POST https://api.indexnow.org/indexnow \
                -H 'Content-Type: application/json; charset=utf-8' --data-binary @- -o /dev/null -w 'IndexNow: HTTP %{http_code}\n'
